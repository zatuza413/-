<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>相殺シューター</title>
    <style>
      :root { --bg: #0b0b12; --fg: #ffe066; }
      html, body {
        margin: 0; height: 100%; background: var(--bg); overflow: hidden;
        /* スマホでのスクロール・ズーム・長押しメニュー・選択を止める */
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 中央寄せは Phaser（autoCenter）に任せる。CSS でも寄せると二重にずれる */
      #game { width: 100%; height: 100%; }
      canvas { cursor: crosshair; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--fg);
        font: bold 20px sans-serif; align-items: center; justify-content: center; text-align: center; padding: 16px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">📱↻<br />スマホを横向きにしてください</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
